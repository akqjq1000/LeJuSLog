services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: lejus-clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-lejus}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-lejus-pass}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-lejuslog}
    ports:
      - "8123:8123"   # HTTP (clickhouse-connect)
      - "9000:9000"   # native
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingest:
    build:
      context: ../server/ingest
    container_name: lejus-ingest
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-lejus}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-lejus-pass}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-lejuslog}
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-secret-token}
      BATCH_SIZE: ${BATCH_SIZE:-1000}
      FLUSH_INTERVAL: ${FLUSH_INTERVAL:-2.0}
    ports:
      - "8080:8080"
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse-data:
